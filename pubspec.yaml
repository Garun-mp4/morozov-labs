name: sequence_trainer
description: "Sequence Trainer — учебное Flutter-приложение для тренировки числовых последовательностей."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  go_router: 18.0.1
  sqflite: 2.4.4
  sqflite_common_ffi: 2.4.3
  path: 1.9.1
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
